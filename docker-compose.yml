# Training stack. The course catalogue is a standard STAC API (stac-fastapi-pgstac) over COGs in
# ./data/catalog. Optional extras (e.g. STAC GIS) can join the shared "geo" network.
name: geo-training

networks:
  geo:
    name: geo
    external: true

volumes:
  caddy_data: {}
  stac_db: {}
  outputs: {}
  vector_cache: {}
  jupyterhub_data: {}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - outputs:/srv/outputs:ro
      - ./geolibre-plugin:/srv/plugins:ro
    networks: [geo]

  geolibre:
    image: ghcr.io/opengeos/geolibre:latest
    restart: unless-stopped
    environment:
      GEOLIBRE_SHARE_URL: "off"
    networks: [geo]

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    restart: unless-stopped
    env_file: .env
    environment:
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      WORKERS_PER_CORE: "1"
    volumes:
      - outputs:/outputs:ro
      - ./data:/data:ro
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/tiles"]
    networks: [geo]

  pygeoapi:
    build: ./pygeoapi
    restart: unless-stopped
    env_file: .env
    environment:
      PYGEOAPI_CONFIG: /pygeoapi/local.config.yml
      PYGEOAPI_OPENAPI: /pygeoapi/local.openapi.yml
      SCRIPT_NAME: /processes-api
      OUTPUT_DIR: /outputs
      OUTPUT_BASE_URL: https://${DOMAIN}/outputs
      DATA_ROOTS: /data/,/outputs/
    volumes:
      - ./data:/data:ro
      - outputs:/outputs
      - vector_cache:/cache
      - ./catalog:/catalog:ro
    deploy:
      resources:
        limits: { cpus: "8", memory: 16g }
    networks: [geo]

  stac-db:
    image: ghcr.io/stac-utils/pgstac:v0.9.8
    restart: unless-stopped
    environment:
      POSTGRES_USER: stac
      POSTGRES_PASSWORD: ${STAC_DB_PASSWORD}
      POSTGRES_DB: stac
      PGUSER: stac
      PGPASSWORD: ${STAC_DB_PASSWORD}
      PGDATABASE: stac
    volumes:
      - stac_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stac -d stac"]
      interval: 5s
      retries: 20
    networks: [geo]

  # Course catalogue. Read-only through Caddy at /stac; writes (scripts/register_cog.py) only via
  # the localhost-bound port on the server.
  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:7.0.0
    restart: unless-stopped
    depends_on:
      stac-db: { condition: service_healthy }
    environment:
      PGUSER: stac
      PGPASSWORD: ${STAC_DB_PASSWORD}
      PGHOST: stac-db
      PGPORT: "5432"
      PGDATABASE: stac
      ENABLE_TRANSACTIONS_EXTENSIONS: "true"
      # Served under /stac both publicly (Caddy) and internally, so links match everywhere.
      ROOT_PATH: /stac
    ports: ["127.0.0.1:8082:8080"]
    networks: [geo]

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PROCESSES_URL: http://pygeoapi:80
    networks: [geo]

  jupyterhub:
    build: ./jupyterhub
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub_data:/srv/jupyterhub
    networks: [geo]
