# Apache front end for servers where Apache already owns ports 80/443 (Caddy then listens on
# 127.0.0.1:8095 only: HTTP_PORT=127.0.0.1:8095, HTTPS_PORT=127.0.0.1:8096, SIDECAR_SITE=:80 in .env).
#   sudo cp apache-site.conf /etc/apache2/sites-available/geolibre.conf   # edit ServerName first
#   sudo a2enmod proxy proxy_http headers && sudo a2ensite geolibre && sudo systemctl reload apache2
#   sudo certbot --apache -d geolibre.terrawatch.net     # adds the HTTPS site and the redirect
<VirtualHost *:80>
    ServerName geolibre.terrawatch.net

    ProxyPreserveHost On
    ProxyRequests Off
    # Uploads and long Whitebox requests
    ProxyTimeout 600
    LimitRequestBody 0
    ProxyPass        / http://127.0.0.1:8095/
    ProxyPassReverse / http://127.0.0.1:8095/

    ErrorLog ${APACHE_LOG_DIR}/geolibre_error.log
    CustomLog ${APACHE_LOG_DIR}/geolibre_access.log combined
</VirtualHost>
